<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Chrome/desktop browsers render the same webfont noticeably heavier
         than iOS/Android's native text renderer does - without this, Expo's
         web build (used for sharing/portfolio links, e.g. to recruiters)
         makes every weight look a step bolder than the real app ever does,
         which reads as a typography mistake even though the app itself is
         fine. Standard browser-only fix, no native-side change - the actual
         app on a phone is untouched (2026-11-23, her catch that Chrome and
         Expo Go render the same weights differently). */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Chrome paints its own light background on an <input> the moment you
         pick a value from its autofill/autocomplete suggestions, overriding
         any author background - web-only (no such thing happens on a real
         device, there's no browser autocomplete dropdown there), her catch
         2026-11-23 on the email field. The box-shadow-inset trick is the
         standard way to override it (background-color itself can't win
         against the browser's autofill styling, but an inset shadow painted
         over the same area can) - matches TextField.tsx's own colors
         (bg0 #050816, textPrimary #FFFFFF) so the field doesn't flash to a
         different look than every other state it has. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #050816 inset !important;
        -webkit-text-fill-color: #FFFFFF !important;
        caret-color: #FFFFFF;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
