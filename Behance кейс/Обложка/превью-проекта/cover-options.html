<!doctype html>
<html><head><meta charset="utf-8">
<title>Behance project cover — D</title>
<!-- Behance feed thumbnail (808×632, made at 2x = 1616×1264), her pick: variant D (Care phone bleeding off the bottom + the evening-calm herb).
     11-14: other variants removed; she found the light under the herb too bright, so D1 = softer, smaller light; D2 = no lights at all; D3 = light behind the phone only.
     ?full=1 shows the frames at 100% for export (tools/cover-shoot.js). -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1e1e22; font-family:-apple-system, sans-serif; color:#9a9aa6; padding:30px 40px 80px; }
  .opt { font-size:15px; margin:40px 0 10px; line-height:1.55; max-width:1100px; } .opt b { color:#e4e2ee; font-weight:500; }
  .zoom { zoom:.42; } body.full .zoom { zoom:1; } body.full .opt, body.full .feed { display:none; }
  .c { width:1616px; height:1264px; position:relative; overflow:hidden; background:#050816; }
  .abs { position:absolute; }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); }
  .feed { display:flex; gap:22px; margin-top:16px; flex-wrap:wrap; }
  .feed .t { width:404px; } .feed .t .img { width:404px; height:316px; border-radius:8px; overflow:hidden; }
  .feed .t .img > .c { zoom:.25; } .feed .cap { font-size:13px; color:#e4e2ee; margin-top:8px; } .feed .cap span { display:block; color:#8a8a96; font-size:12px; }
  .ph { position:absolute; filter:drop-shadow(0 30px 80px rgba(5,8,22,.9)); }
</style></head><body><div id="wrap">

<div class="opt"><b>D1 · Мягче.</b> Свет за травой меньше и тусклее, за телефоном как было.</div>
<div class="zoom"><div class="c" id="D1"></div></div>

<div class="opt"><b>D2 · Без пятен.</b> Чистый тёмный фон, светятся только экран и трава.</div>
<div class="zoom"><div class="c" id="D2"></div></div>

<div class="opt"><b>D3 · Свет только за телефоном.</b> Трава на чистом тёмном фоне, мягкое пятно остаётся только за экраном.</div>
<div class="zoom"><div class="c" id="D3"></div></div>

<div class="opt"><b>Как это выглядит в ленте</b> (размер превью на Behance):</div>
<div class="feed" id="feed"></div>

</div>
<script>
if (new URLSearchParams(location.search).get('full')) document.body.classList.add('full');
const TH = '../../Мокапы/thin/', P = '../../Мокапы/parts/';
const put = (id, h) => document.getElementById(id).insertAdjacentHTML('beforeend', h);
const glow = (x, y, r, c, o) => `<div class="glow" style="left:${x - r}px; top:${y - r}px; width:${2 * r}px; height:${2 * r}px; background:${c}; opacity:${o}"></div>`;
const phone = (src, cx, top, h, ratio = 1620 / 3400) => `<img class="ph" src="${src}" style="left:${cx - h * ratio / 2}px; top:${top}px; height:${h}px">`;
const D = lights => lights + phone(TH + 'phone-care.png', 520, 120, 1180) + `<img class="abs" src="${P}evening-calm-herbs-hi.png" style="left:900px; top:140px; height:1000px">`;

put('D1', D(glow(560, 640, 520, '#4C41B0', .55) + glow(1180, 620, 260, '#6355D6', .22)));
put('D2', D(''));
put('D3', D(glow(560, 640, 520, '#4C41B0', .55)));

const feed = document.getElementById('feed');
for (const id of ['D1', 'D2', 'D3']) { const src = document.getElementById(id);
  feed.insertAdjacentHTML('beforeend', `<div class="t"><div class="img">${src.outerHTML.replace(`id="${id}"`, '')}</div><div class="cap">Soma · Wellness App UX/UI Case Study<span>Anastasia Kokyrtsa · ${id}</span></div></div>`); }
</script>
</body></html>
