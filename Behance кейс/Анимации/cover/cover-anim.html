<!doctype html>
<html><head><meta charset="utf-8">
<title>Cover SOMA loop</title>
<!-- Cover, animated inside the glass SOMA letters only. cover.png = the Figma cover render; soma-mask.png = the letters
     (from Figma, slightly eroded so the glass rim stays clean) minus the phone. ?v=stars | ?v=light. window.render(t), seamless at T. -->
<style>html,body{margin:0;background:#050816} #s{position:relative;width:1920px;height:1400px} canvas{position:absolute;left:0;top:0}</style>
</head><body><div id="s"><canvas id="c" width="1920" height="1400"></canvas></div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'stars';
const T = V === 'stars' ? 10 : 9;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fx = document.createElement('canvas'); fx.width = 1920; fx.height = 1400; const f = fx.getContext('2d');
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let bg, mask;
// letters span x≈305–1676, y≈399–703
const BOX = { x: 290, y: 380, w: 1400, h: 340 };
let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
// the app's own star field (components/starsSvgSource.ts): white dots, r 0.5–1.0 css px at 50% opacity, ~400 per 1000×1000 css px.
// On the cover the phone screen is ~1.4× the app's css size, so stars are r 0.7–1.4 px at the same look; a few are a little larger,
// about a quarter twinkle softly. Positions never move.
const N = Math.round(BOX.w * BOX.h * 440e-6 * 1.6); // phone screen has ~440 per 1e6 px; letters get 1.6× (her ask: a few more)
const STARS = Array.from({ length: N }, () => { const big = rnd() < .09;
  return { x: BOX.x + rnd() * BOX.w, y: BOX.y + rnd() * BOX.h, r: big ? 1.3 + rnd() * .5 : .6 + rnd() * .5, tw: big || rnd() < .4, ph: rnd(), k: 1 + Math.floor(rnd() * 2) }; });
function stars(t) {
  const p = t / T;
  for (const s of STARS) {
    const w = Math.pow((1 + Math.sin(2 * Math.PI * (s.k * p + s.ph))) / 2, 2.2), a = s.tw ? .05 + .95 * w : .45; const rr = s.tw ? s.r * (1 + .5 * w) : s.r; // twinkle: dims almost out, then flares a little larger
    f.globalAlpha = a; f.fillStyle = '#FFFFFF'; f.beginPath(); f.arc(s.x, s.y, rr, 0, 2 * Math.PI); f.fill();
    if (s.tw && w > .5) { const R = rr * 6, g = f.createRadialGradient(s.x, s.y, 0, s.x, s.y, R); g.addColorStop(0, `rgba(230,224,255,${.45 * (w - .5) * 2})`); g.addColorStop(1, 'rgba(230,224,255,0)'); f.globalAlpha = 1; f.fillStyle = g; f.fillRect(s.x - R, s.y - R, 2 * R, 2 * R); }
    if (s.r > 1.4) { const g = f.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4); g.addColorStop(0, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(255,255,255,0)'); f.fillStyle = g; f.fillRect(s.x - s.r * 4, s.y - s.r * 4, s.r * 8, s.r * 8); }
  }
  f.globalAlpha = 1;
}
// a soft violet light drifting slowly behind the glass, breathing in the practice's rhythm
function light(t) {
  const p = 2 * Math.PI * t / T, breath = (1 - Math.cos(2 * p)) / 2; // two breaths per loop
  const cx = 990 + 520 * Math.sin(p), cy = 560 + 40 * Math.sin(2 * p + .6), R = 420 + 60 * breath;
  let g = f.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, `rgba(201,187,250,${.55 + .25 * breath})`); g.addColorStop(.35, `rgba(139,124,246,${.32 + .15 * breath})`); g.addColorStop(1, 'rgba(99,85,214,0)');
  f.fillStyle = g; f.fillRect(0, 0, 1920, 1400);
  const cx2 = 990 - 600 * Math.sin(p + .9), R2 = 300; // a fainter pink counter-light
  g = f.createRadialGradient(cx2, 600, 0, cx2, 600, R2); g.addColorStop(0, `rgba(255,198,241,${.22 + .1 * breath})`); g.addColorStop(1, 'rgba(255,198,241,0)');
  f.fillStyle = g; f.fillRect(0, 0, 1920, 1400);
}
window.render = t => {
  f.clearRect(0, 0, 1920, 1400); f.globalCompositeOperation = 'source-over';
  (V === 'stars' ? stars : light)(t);
  f.globalCompositeOperation = 'destination-in'; f.drawImage(mask, 0, 0); f.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(bg, 0, 0);
  ctx.globalCompositeOperation = 'screen'; ctx.drawImage(fx, 0, 0); ctx.globalCompositeOperation = 'source-over';
};
Promise.all([load('cover.png'), load('soma-mask.png')]).then(([a, b]) => { bg = a; mask = b; window.render(0); window.__ready = true; });
</script></body></html>
