<!doctype html>
<html><head><meta charset="utf-8">
<!-- Renders real UI Kit components (kit CSS, untouched) on the case background, English labels, for the Icons & elements block. -->
<link rel="stylesheet" href="../../../UI Kit/css/style.css">
<style>body{background:#050816; min-height:0} body::before{display:none}
  .g{display:inline-grid; padding:36px; gap:44px 40px; background:#050816}
  #buttons{grid-template-columns:380px 380px}
  #cards{grid-template-columns:184px 184px}</style>
</head><body>
<div class="g" id="buttons">
  <button class="btn btn-primary">Continue</button><button class="btn btn-secondary">Skip for now</button>
  <button class="btn btn-primary force-pressed">Continue</button><button class="btn btn-secondary force-pressed">Skip for now</button>
  <button class="btn btn-primary" disabled>Continue</button><button class="btn btn-secondary" disabled>Skip for now</button>
</div><br>
<div class="g" id="buttonsP" style="grid-template-columns:380px">
  <button class="btn btn-primary">Continue</button>
  <button class="btn btn-primary force-pressed">Continue</button>
  <button class="btn btn-primary" disabled>Continue</button>
</div><br>
<div class="g" id="cards">
  <div class="stat-card"><div class="stat-icon-ring"><img src="../../../UI Kit/assets/icons-clean/pulse.svg" alt=""></div><p class="stat-title">Biorhythms</p><p class="stat-value">68% today</p></div>
  <div class="stat-card force-pressed"><div class="stat-icon-ring"><img src="../../../UI Kit/assets/icons-clean/pulse.svg" alt=""></div><p class="stat-title">Biorhythms</p><p class="stat-value">68% today</p></div>
</div>
<br>
<div class="g" id="tiles" style="grid-template-columns:auto">
  <div class="kit-row">
    <div class="mini-tile"><div class="mt-icon-frame"><img src="../../../UI Kit/assets/icons-clean/circle.svg" alt=""></div><div class="mt-text"><p class="mt-title">Breathing</p><p class="mt-time">3 min</p></div></div>
    <div class="mini-tile"><div class="mt-icon-frame" style="margin-bottom:26px"><img src="../../../UI Kit/assets/icons-clean/sea-waves.svg" alt=""></div><div class="mt-text"><p class="mt-title">Nature sounds</p><p class="mt-time">10 min</p></div></div>
    <div class="mini-tile"><div class="mt-icon-frame"><img id="lotus" src="../../../UI Kit/assets/icons-clean/lotus.svg" alt=""></div><div class="mt-text"><p class="mt-title">Meditation</p><p class="mt-time">10 min</p></div></div>
  </div>
</div><br>
<div class="g" id="nav" style="grid-template-columns:412px; padding:40px">
        <nav class="bottombar" id="bottomNav">
          <svg class="bottombar-svg" viewBox="0 0 412 125" preserveAspectRatio="none">
            <path d="M 6,50
L 140.12,50
C 159.30,50 158.02,48.79 166.12,31.40
A 44,44 0 0,1 245.88,31.40
C 253.98,48.79 252.70,50 271.88,50
L 406,50
Q 412,50 412,56
L 412,99
Q 412,125 386,125
L 26,125
Q 0,125 0,99
L 0,56
Q 0,50 6,50
Z" fill="#0C0D1B"/>
          </svg>
          <div class="bottombar-content">
            <button class="bottombar-item" data-tab="home">
              <img class="icon-default" src="../../../UI Kit/assets/icons-clean/home.svg" alt="">
              <img class="icon-active" src="../../../UI Kit/assets/icons-clean/home-alt.svg" alt="" style="display:none">
              <span>Home</span>
            </button>
            <button class="bottombar-item" data-tab="care">
              <img class="icon-default" src="../../../UI Kit/assets/icons-clean/care.svg" alt="">
              <img class="icon-active" src="../../../UI Kit/assets/icons-clean/care-alt.svg" alt="" style="display:none">
              <span>Care</span>
            </button>
            <div style="width:68px" aria-hidden="true"></div>
            <button class="bottombar-item" data-tab="journal">
              <img class="icon-default" src="../../../UI Kit/assets/icons-clean/journal.svg" alt="">
              <img class="icon-active" src="../../../UI Kit/assets/icons-clean/journal-alt.svg" alt="" style="display:none">
              <span>Journal</span>
            </button>
            <button class="bottombar-item is-active" data-tab="analytics">
              <img class="icon-default" src="../../../UI Kit/assets/icons-clean/analytics-tab.svg" alt="" style="display:none">
              <img class="icon-active" src="../../../UI Kit/assets/icons-clean/analytics-tab-alt.svg" alt="">
              <span>Analytics</span>
            </button>
          </div>
          <div class="bottombar-fab"><span class="icon-plus"></span></div>
        </nav>
</div>
</body></html>
