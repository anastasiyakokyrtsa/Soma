<!doctype html>
<html><head><meta charset="utf-8">
<title>Icons & elements</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap" rel="stylesheet">
<!-- Block "10 / Icons & elements", her pick: option 3 "In their place" (real EN screen fragments, crops in b10/, hairline notes on one middle spine).
     11-01: other options removed; added a second band with the resource meter (left) and the primary button (right), notes on the same spine. -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1e1e22; font-family:'Nunito Sans',sans-serif; padding:30px 0 80px; }
  .wrap { width:1400px; margin:0 auto; }
  .opt { color:#9a9aa6; font-size:15px; margin:44px 0 10px; line-height:1.55; max-width:1300px; }
  .opt b { color:#e4e2ee; font-weight:400; }
  .frame { width:1920px; position:relative; overflow:hidden; background:#050816; transform:scale(.7292); transform-origin:top left; }
  .abs { position:absolute; }
  .label { position:absolute; left:102px; top:160px; font-size:20px; letter-spacing:.04em; color:#6E7390; }
  .h1 { position:absolute; left:102px; top:247px; margin:0; font-weight:300; font-size:68px; line-height:1.3; color:#A6ABC6; white-space:nowrap; }
  .h1 em { font-style:normal; color:#A89CF8; }
  .lead { position:absolute; left:102px; top:363px; width:1300px; font-weight:300; font-size:40px; line-height:1.45; color:#6E7390; }
  .note { font-weight:300; font-size:20px; line-height:1.5; color:#A6ABC6; }
  .note small { display:block; font-size:16px; color:#6E7390; margin-top:4px; }
  .hair { position:absolute; height:1px; background:rgba(201,187,250,.28); }
  .dot { position:absolute; width:7px; height:7px; border-radius:50%; background:#C9BBFA; margin:-3px 0 0 -3px; }
  .fadetop { -webkit-mask-image:linear-gradient(transparent 4%, #000 34%, #000 80%, transparent); mask-image:linear-gradient(transparent 4%, #000 34%, #000 80%, transparent); }
  .fadeb { -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
  .fadeall { -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); mask-image:radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); }
  .fadesoft { -webkit-mask-image:radial-gradient(ellipse 80% 75% at 50% 50%, #000 70%, transparent 100%); mask-image:radial-gradient(ellipse 80% 75% at 50% 50%, #000 70%, transparent 100%); }
  .fadering { -webkit-mask-image:radial-gradient(circle closest-side, #000 80%, transparent 100%); mask-image:radial-gradient(circle closest-side, #000 80%, transparent 100%); }
</style></head><body><div class="wrap">

<div class="opt"><b>3 · In their place</b>, плюс кольцо ресурса, карточки аналитики (default / pressed) и все состояния кнопок из кита; заметки на той же средней линии.</div>
<div class="frame" id="V3" style="height:2720px; margin-bottom:-737px"></div>

</div>
<script>
const B = 'b10/';
const nb = s => s.replace(/(^|\s)(\S{1,3})\s/g, '$1$2&nbsp;').replace(/\s(\S+)\s(\S+)$/, ' $1&nbsp;$2');
const put = (id, h) => document.getElementById(id).insertAdjacentHTML('beforeend', h);
const head = (h, lead) => `<div class="label">10 / Icons &amp; elements</div><h2 class="h1">${h}</h2><div class="lead">${nb(lead)}</div>`;

(() => { let h = head('Small signs, <em>drawn with light</em>', 'Each element has one job. Here they are where they live, on the screens of the app.');
  // band 1: ritual tiles and tab bar on the left, the tea herb on the right
  h += `<img class="abs fadeb" src="${B}care-tiles.png" style="left:102px; top:604px; width:780px">`;
  h += `<img class="abs fadetop" src="${B}tabbar.png" style="left:102px; top:1230px; width:780px">`;
  h += `<img class="abs fadeall" src="${B}tea-herb.png" style="left:1210px; top:590px; height:1000px">`;
  // band 2: resource meter on the left, analytics stat cards (kit, default and pressed) on the right
  h += `<img class="abs fadering" src="${B}care-ring.png" style="left:232px; top:1600px; width:520px">`;
  h += `<img class="abs" src="${B}kit-cards.png" style="left:1266px; top:1713px; width:552px">`;
  // band 3: buttons from the kit, primary and secondary, default / pressed / disabled (rows)
  h += `<img class="abs" src="${B}kit-buttons.png" style="left:70px; top:2240px; width:785px">`;
  // all notes sit on one spine in the middle column; hairlines run to it from the fragments
  const note = (y, txt, sub) => `<div class="abs note" style="left:950px; top:${y - 16}px; width:270px">${txt}<small>${nb(sub)}</small></div>`;
  const line = (x1, x2, y) => `<div class="dot" style="left:${x1}px; top:${y}px"></div><div class="hair" style="left:${Math.min(x1, x2)}px; top:${y}px; width:${Math.abs(x2 - x1)}px"></div>`;
  h += line(746, 936, 790) + note(790, 'Gradient icon, 60 px', 'Practices and body signals. Never glows.');
  h += line(1500, 1230, 1000) + note(1000, 'Herb illustration', 'Drawn in points of light, like the stars behind every screen.');
  h += line(1560, 1230, 1210) + note(1210, 'One herb per tea', 'Six plants for the tea ritual, in one hand.');
  h += line(330, 936, 1388) + note(1388, 'Nav icon, 30 px', 'Outline at rest, solid violet with a label when active.');
  h += line(624, 936, 1700) + note(1700, 'Resource meter', 'A thin arc in the same calm violet, even at a low 42%.');
  h += line(1307, 1230, 1860) + note(1860, 'Analytics stat card', 'No border at rest. Pressed, it sinks a little and gets a soft gradient ring.');
  h += line(822, 936, 2385) + note(2385, 'Buttons, three states', 'Default glows to invite a tap. Pressed lights up and sinks a little. Disabled keeps only its outline.');
  put('V3', h); })();
</script>
</body></html>
