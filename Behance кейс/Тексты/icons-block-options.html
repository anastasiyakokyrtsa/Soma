<!doctype html>
<html><head><meta charset="utf-8">
<title>Icons & elements</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap" rel="stylesheet">
<!-- Block "10 / Icons & elements", her pick: option 3 "In their place" (real EN screen fragments, crops in b10/, hairline notes on one middle spine).
     11-01: other options removed; added a second band with the resource meter (left) and the primary button (right), notes on the same spine. -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1e1e22; font-family:'Nunito Sans',sans-serif; padding:30px 0 80px; }
  .wrap { width:1400px; margin:0 auto; }
  .opt { color:#9a9aa6; font-size:15px; margin:44px 0 10px; line-height:1.55; max-width:1300px; }
  .opt b { color:#e4e2ee; font-weight:400; }
  .frame { width:1920px; position:relative; overflow:hidden; background:#050816; transform:scale(.7292); transform-origin:top left; }
  .abs { position:absolute; }
  .label { position:absolute; left:102px; top:160px; font-size:20px; letter-spacing:.04em; color:#6E7390; }
  .h1 { position:absolute; left:102px; top:247px; margin:0; font-weight:300; font-size:68px; line-height:1.3; color:#A6ABC6; white-space:nowrap; }
  .h1 em { font-style:normal; color:#A89CF8; }
  .lead { position:absolute; left:102px; top:363px; width:1300px; font-weight:300; font-size:40px; line-height:1.45; color:#6E7390; }
  /* notes = block 11 (Onboarding) note style: title Regular 22 #A6ABC6, text Light 22 #6E7390, 155%, gap 4, width 300 */
  .note { font-weight:400; font-size:22px; line-height:1.55; color:#A6ABC6; }
  .note small { display:block; font-weight:300; font-size:22px; line-height:1.55; color:#6E7390; margin-top:4px; }
  .hair { position:absolute; height:1px; background:rgba(201,187,250,.28); }
  .dot { position:absolute; width:7px; height:7px; border-radius:50%; background:#C9BBFA; margin:-3px 0 0 -3px; }
  .fadetop { -webkit-mask-image:linear-gradient(transparent 4%, #000 34%, #000 80%, transparent); mask-image:linear-gradient(transparent 4%, #000 34%, #000 80%, transparent); }
  .fadeb { -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
  .fadeall { -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); mask-image:radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); }
  .fadesoft { -webkit-mask-image:radial-gradient(ellipse 80% 75% at 50% 50%, #000 70%, transparent 100%); mask-image:radial-gradient(ellipse 80% 75% at 50% 50%, #000 70%, transparent 100%); }
  .fadering { -webkit-mask-image:radial-gradient(circle closest-side, #000 80%, transparent 100%); mask-image:radial-gradient(circle closest-side, #000 80%, transparent 100%); }
</style></head><body><div class="wrap">

<div class="opt"><b>3 · In their place</b>, плюс кольцо ресурса, карточки аналитики (default / pressed) и все состояния кнопок из кита; заметки на той же средней линии.</div>
<div class="frame" id="V3" style="height:2580px; margin-bottom:-699px"></div>

</div>
<script>
const B = 'b10/';
const nb = s => s.replace(/(^|\s)(\S{1,3})\s/g, '$1$2 ').replace(/ ([^ ]+) ([^ ]+)$/, ' $1 $2');  // last-pair rule must not undo the short-word nbsp
const put = (id, h) => document.getElementById(id).insertAdjacentHTML('beforeend', h);
const head = (h, lead) => `<div class="label">10 / Icons &amp; elements</div><h2 class="h1">${h}</h2><div class="lead">${nb(lead)}</div>`;

(() => { let h = head('Small signs, <em>drawn with light</em>', 'Each element has one job. Here they are as the kit draws them, with a note on why.');
  // every leader runs from the notes spine to the vertical middle of its target and stops GAP short of it (her rule)
  const GAP = 22, SPINE_L = 936, SPINE_R = 1264, G = 190;  // G: the same gap between consecutive elements in both columns
  const note = (y, txt, sub) => `<div class="abs note" style="left:950px; top:${y - 17}px; width:300px">${txt}<small>${nb(sub)}</small></div>`;
  const toLeft = (edge, y) => `<div class="hair" style="left:${edge + GAP}px; top:${y}px; width:${SPINE_L - edge - GAP}px"></div><div class="dot" style="left:${edge + GAP}px; top:${y}px"></div>`;
  const toRight = (edge, y) => `<div class="hair" style="left:${SPINE_R}px; top:${y}px; width:${edge - GAP - SPINE_R}px"></div><div class="dot" style="left:${edge - GAP}px; top:${y}px"></div>`;
  // LEFT COLUMN (kit renders, 3x PNG; CSS-px boxes in b10/kit-boxes.json)
  const T = 1.8, top1 = 604, bot1 = top1 + 213 * T;  // ritual tiles: row 380 css px (= 684 here), group padding 36; lotus box x ..388, centre y 102
  h += `<img class="abs" src="${B}kit-tiles.png" style="left:${102 - 36 * T}px; top:${top1 - 36 * T}px; width:${452 * T}px">`;
  h += toLeft(102 - 36 * T + 388 * T, top1 + 66 * T) + note(top1 + 66 * T, 'Gradient icon, 60 px', 'Practices and body signals. Never glows.');
  const N = 380 * T / 412, svgTop = bot1 + G - 6 * N, bot2 = svgTop + 125 * N;  // tab bar as wide as the tiles row; dome top at 6 css px
  h += `<img class="abs" src="${B}kit-nav.png" style="left:${102 - 40 * N}px; top:${svgTop - 40 * N}px; width:${492 * N}px">`;
  h += toLeft(102 + 373.5 * N, svgTop + 80.5 * N) + note(svgTop + 80.5 * N, 'Nav icon, 27 px', 'Outline at rest, solid violet with a label when active.');
  const RS = 520 / 1800, RY = bot2 + G - 208 * RS, bot3 = RY + 1573 * RS;  // resource meter crop: arc spans y 208..1573, right edge x 1627, centre y 890
  h += `<img class="abs fadering" src="${B}care-ring.png" style="left:232px; top:${RY}px; width:520px">`;
  h += toLeft(232 + 1627 * RS, RY + 890 * RS) + note(RY + 890 * RS, 'Resource meter', 'A thin arc in the same calm violet, even at a low 42%.');
  const K = 1.2, KY = bot3 + G - 36 * K;  // primary buttons only: default / pressed / disabled; pressed spans x 41.7..410.3, centre y 161
  h += `<img class="abs" src="${B}kit-buttonsP.png" style="left:${102 - 36 * K}px; top:${KY}px; width:${452 * K}px">`;
  h += toLeft(102 - 36 * K + 410.3 * K, KY + 161 * K) + note(KY + 161 * K, 'Primary button, three states', 'Default glows to invite a tap. Pressed lights up and sinks a little. Disabled keeps only its outline.');
  // RIGHT COLUMN: the herb (transparent original, visible bbox x 18..831, y 16..1576 of 846×1580), its right edge on the 102 margin
  const HS = 640 / 1560, HX = 1818 - 831 * HS, HY = top1 - 16 * HS, botH = top1 + 640;
  h += `<img class="abs" src="../Мокапы/parts/evening-calm-herbs-hi.png" style="left:${HX}px; top:${HY}px; width:${846 * HS}px">`;
  h += toRight(HX + 57 * HS, HY + 735 * HS) + note(HY + 735 * HS, 'Herb illustration', 'Drawn in points of light, like the stars behind every screen.');
  h += toRight(HX + 57 * HS, HY + 1165 * HS) + note(HY + 1165 * HS, 'One herb per tea', 'Six plants for the tea ritual, in one hand.');
  const C = 1.15, CT = botH + G;  // stat cards, right edge of card 2 (css x 444) on the margin
  h += `<img class="abs" src="${B}kit-cards.png" style="left:${1818 - 444 * C}px; top:${CT - 36 * C}px; width:${480 * C}px">`;
  h += toRight(1818 - 444 * C + 36 * C, CT + 92 * C) + note(CT + 92 * C, 'Analytics stat card', 'No border at rest. Pressed, it sinks a little and gets a soft gradient ring.');
  document.getElementById('V3').style.height = Math.round(KY + 323 * K + 190) + 'px';
  put('V3', h); })();
</script>
</body></html>
