<!doctype html>
<html><head><meta charset="utf-8">
<!-- iPhone mockup for the Behance case. Usage: mockup.html?img=<path>&view=front|left|right|float
     Rendered to transparent PNG by render-mockups.js. -->
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { background:transparent; }
  body { width:1000px; height:1100px; display:flex; align-items:center; justify-content:center; perspective:2600px; }
  .phone { position:relative; width:418px; height:872px; transform-style:preserve-3d; }

  /* body thickness: stacked copies of the outline behind the front face */
  .slab { position:absolute; inset:0; border-radius:68px; background:linear-gradient(90deg,#3a3a42,#1d1d22 18%,#2c2c33 50%,#1d1d22 82%,#3a3a42); }
  .btn { position:absolute; width:4px; border-radius:2px; background:linear-gradient(90deg,#4a4a52,#232328); }

  .front { position:absolute; inset:0; border-radius:68px; padding:4px;
    background:linear-gradient(135deg,#6b6b74,#2b2b31 30%,#55555d 52%,#26262b 75%,#62626a); transform:translateZ(0); }
  .bezel { width:100%; height:100%; border-radius:64px; background:#000; padding:10px; }
  .screen { position:relative; width:390px; height:844px; border-radius:54px; overflow:hidden; background:#050816; }
  .screen img { display:block; width:100%; height:100%; }
  .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:126px; height:37px; border-radius:20px; background:#000; }
  .status { position:absolute; top:0; left:0; right:0; height:47px; color:#fff; font:600 17px/1 -apple-system,'SF Pro Text',system-ui,sans-serif; }
  .time { position:absolute; left:52px; top:17px; letter-spacing:-.2px; }
  .icons { position:absolute; right:30px; top:18px; display:flex; gap:6px; align-items:center; }
  .glare { position:absolute; inset:0; border-radius:54px; pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 28%,transparent 42%); }
</style></head><body>
<div class="phone" id="phone">
  <div id="slabs"></div>
  <div class="front">
    <div class="bezel"><div class="screen">
      <img id="img">
      <div class="status">
        <span class="time">9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2C13.5 1.6 10.9.6 8 .6S2.5 1.6.5 3.6l1.2 1.2C3.4 3.2 5.6 2.3 8 2.3zm0 3.4c1.5 0 2.8.5 3.9 1.4l1.2-1.2C11.7 4.6 9.9 4 8 4s-3.7.6-5.1 1.9l1.2 1.2C5.2 6.2 6.5 5.7 8 5.7zm0 3.3c.6 0 1.1.2 1.6.5L8 11.2 6.4 9.5c.5-.3 1-.5 1.6-.5z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".45"/></svg>
        </span>
      </div>
      <div class="island"></div>
      <div class="glare" id="glare"></div>
    </div></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('img').src = q.get('img');
  const view = q.get('view') || 'front';
  const views = {
    front: 'none',
    left:  'rotateY(26deg) rotateX(4deg) rotateZ(-1deg)',
    right: 'rotateY(-26deg) rotateX(4deg) rotateZ(1deg)',
    float: 'rotateX(46deg) rotateZ(-28deg)',
  };
  const phone = document.getElementById('phone');
  phone.style.transform = views[view];
  if (view === 'front') document.getElementById('glare').style.display = 'none';
  const FLAT = view === 'front'; // flat view: no 3D context at all (body depth is invisible head-on anyway)

  // 12px-thick body, plus side buttons sitting mid-depth so they show when the phone is turned
  const DEPTH = 12, slabs = document.getElementById('slabs');
  let html = '';
  if (!FLAT) for (let i = DEPTH; i >= 1; i--) html += `<div class="slab" style="transform:translateZ(${-i}px);filter:brightness(${0.75 + 0.25 * (1 - i / DEPTH)})"></div>`;
  const z = FLAT ? '' : `transform:translateZ(${-DEPTH / 2}px)`;
  html += `<div class="btn" style="left:-3px;top:150px;height:34px;${z}"></div>
           <div class="btn" style="left:-3px;top:215px;height:62px;${z}"></div>
           <div class="btn" style="left:-3px;top:290px;height:62px;${z}"></div>
           <div class="btn" style="right:-3px;top:245px;height:100px;${z}"></div>`;
  slabs.innerHTML = html;
</script>
</body></html>
